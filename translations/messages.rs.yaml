  <p>Zahvaljujemo se na porudžbini na sajtu %site_name%. U roku od 24h ćete biti kontaktirani radi potvrde Vaše porudžbine. Proveravamo stanje veličine. Traženje veličine može da potraje.Hvala na strpljenju.</p>
