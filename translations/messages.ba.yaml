  <p>Plaćanje nije uspjelo.<br> Vaš račun nije zadužen, najčešći uzrok je pogrešno uneseni broj kartice, datum isteka ili sigurnosni kod. Pokušajte ponovo, u slučaju uzastopnih grešaka pozovite svoju banku.</p>
  <p class="last-child">Ako imate problema sa kupovinom, kontaktirajte nas putem e-pošte ili telefona. Hvala.</p>'
