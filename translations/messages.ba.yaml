email.order.text: '<h3>Poštovani/a %first_name%,</h3>
  <p>Hvala vam što ste naručili sa %site_name%. Bićete kontaktirani u roku od 24 sata da potvrdite vašu narudžbu. Provjeravamo status veličine. Pretraga veličine može potrajati. Hvala na strpljenju.</p>
  <p>Ako imate pitanja ili želite promijeniti narudžbu, kliknite na dugme za odgovor. Molimo vas da ne mijenjate naslov narudžbe, kako bismo lakše pronašli vašu narudžbu u sistemu. Hvala.</p>
   <p class="last-child">Detalji narudžbe su prikazani ispod</p>'
