bazinga_jstranslation_js:
  path:  /translations/{domain}.{_format}
  defaults: { _controller: bazinga.jstranslation.controller:getTranslationsAction, domain: null, _format: "js" }
  methods:  [ GET ]
  options:
    i18n: false
    expose: true
  requirements:
    _format: js|json
    domain: "[\\w]+"

admin:
  resource: 'routes/routes_admin.yaml'
  prefix: /admin
  options:
    expose: true

site.legacy_shop_page_redirect:
  path: /artikal
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController
  defaults:
    route: site.shop_page
    permanent: true

site.product_page:
  path:
    rs: /{slug}
    en: /{_locale}/{slug}
  defaults: { _controller: App\Controller\Site\ProductPageController::index}
  options:
    expose: true