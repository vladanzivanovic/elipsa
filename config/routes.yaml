_bazinga_jstranslation:
  resource: "@BazingaJsTranslationBundle/Resources/config/routing/routing.yml"
  prefix: '/translator'

admin:
  resource: 'routes/routes_admin.yaml'
  prefix: /admin
  options:
    expose: true

site.legacy_shop_page_redirect:
  path: /artikal
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController
  defaults:
    route: site.shop_page
    permanent: true

site.product_page:
  path:
    rs: /{slug}
    en: /{_locale}/{slug}
#    ba: /{_locale}/{slug}
  defaults: { _controller: App\Controller\Site\ProductPageController::index}
  options:
    expose: true
