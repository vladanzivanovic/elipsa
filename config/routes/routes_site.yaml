site.loyalty:
  path:
    rs: /loyalty
    en: /en/loyalty
    ba: /loyalty
  controller: Symfony\Bundle\FrameworkBundle\Controller\TemplateController
  defaults:
    template: Site/Pages/loyalty.html.twig
  options:
    expose: true

site.registration:
  path:
    rs: /registracija
    en: /en/registration
    ba: /registracija
  controller: Symfony\Bundle\FrameworkBundle\Controller\TemplateController
  defaults:
    template: Site/Pages/registration.html.twig
  options:
    expose: true

site.registration_confirmation:
  path:
    rs: /uspesna-registracija
    en: /en/success-registration
    ba: /uspjesna-registracija
  controller: Symfony\Bundle\FrameworkBundle\Controller\TemplateController
  defaults:
    template: Site/Pages/registrationSuccess.html.twig
  options:
    expose: true

site.cart_page:
  path:
    rs: /korpa
    en: /en/cart
    ba: /korpa
  controller: Symfony\Bundle\FrameworkBundle\Controller\TemplateController
  defaults:
    template: Site/Pages/cart.html.twig

site.checkout_page:
  path:
    rs: /korpa/unos-podataka
    en: /en/checkout
    ba: /korpa/unos-podataka
  controller: Symfony\Bundle\FrameworkBundle\Controller\TemplateController
  defaults:
    template: Site/Pages/checkout.html.twig

site.facebook_login:
  path: /login/check/facebook

site.google_login:
  path: /login/check/google

site.logout:
  path: /logout

site.not_exists_page:
  path:
    rs: /nepostojeca-stranica
    en: /en/not-exits-page
    ba: /nepostojeca-stranica
  controller: Symfony\Bundle\FrameworkBundle\Controller\TemplateController
  defaults:
    template: Site/Pages/404Page.html.twig

site.robots:
  path: /robots.txt
  controller: Symfony\Bundle\FrameworkBundle\Controller\TemplateController
  defaults:
    template: Site/robots.txt.twig

