site.checkout_completed_successful:
  path:
    rs: /korpa/uspesna-narudzbina
    en: /en/cart/success-order
  controller: Symfony\Bundle\FrameworkBundle\Controller\TemplateController
  defaults:
    template: Site/Pages/checkoutComplete.html.twig
  options:
    expose: true

site.loyalty:
  path:
    rs: /loyalty
    en: /en/loyalty
  controller: Symfony\Bundle\FrameworkBundle\Controller\TemplateController
  defaults:
    template: Site/Pages/loyalty.html.twig

site.ask_us:
  path:
    rs: /pitajte-nas
    en: /en/ask-us
  controller: Symfony\Bundle\FrameworkBundle\Controller\TemplateController
  defaults:
    template: Site/Pages/askUsPage.html.twig

site.logout:
  path: /logout
