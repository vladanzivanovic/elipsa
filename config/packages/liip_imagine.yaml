liip_imagine :
    resolvers:
        ads_photos:
            web_path:
                web_root: "%kernel.project_dir%/storage"
                cache_prefix: "/cache"
    loaders:
        default:
            filesystem:
                data_root: "%kernel.project_dir%/storage"
    filter_sets :
        #        cache : ads_photos
        single_thumb :
            cache: ads_photos
            quality : 100
            filters :
                thumbnail  : { size : [70, 70], mode : outbound }
                background : { size : [70, 70], position : center, color : '#ffffff' }
        list_thumb :
            cache: ads_photos
            quality : 90
            filters :
                thumbnail  : { size : [370, 551], mode : outbound }
                background : { size : [370, 551], position : center, color : '#ffffff' }
        product_image :
            cache: ads_photos
            quality : 100
            filters :
                thumbnail  : { size : [428, 547], mode : outbound }
                background : { size : [428, 547], position : center, color : '#ffffff' }
        product_image_thumb :
            cache: ads_photos
            quality : 100
            filters :
                thumbnail  : { size : [111, 140], mode : outbound }
                background : { size : [111, 140], position : center, color : '#ffffff' }
        grid_thumb :
            cache: ads_photos
            quality : 90
            filters :
                thumbnail  : { size : [256, 381], mode : outbound }
                background : { size : [256, 381], position : center, color : '#ffffff' }
